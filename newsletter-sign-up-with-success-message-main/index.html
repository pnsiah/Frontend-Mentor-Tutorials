<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap"
      rel="stylesheet"
    />
    <title>
      Frontend Mentor | Newsletter sign-up form with success message
    </title>
  </head>
  <body>
    <main>
      <!-- Sign-up form start -->
      <section class="form-body">
        <h1 class="form-body-heading fw-bold primary-clr">Stay updated!</h1>
        <p class="form-body-text">
          Join 60,000+ product managers receiving monthly updates on:
        </p>
        <ul class="obj">
          <li>
            <img
              src="./assets/images/icon-success.svg"
              alt="Success icon"
            />Product discovery and building what matters
          </li>
          <li>
            <img
              src="./assets/images/icon-success.svg"
              alt="Success icon"
            />Measuring to ensure updates are a success
          </li>
          <li>
            <img src="./assets/images/icon-success.svg" alt="Success icon" />And
            much more!
          </li>
        </ul>
        <form action="">
          <label for="email" class="primary-clr fw-bold">
            Email address
            <p class="error-mes hide">Valid email required</p>
          </label>
          <input
            type="text"
            name=""
            id="email"
            class="email"
            placeholder="email@company.com"
          />
          <button type="submit" class="submit">
            Subscribe to monthly newsletter
          </button>
        </form>
      </section>
      <!-- Sign-up form end -->
    </main>

    <!-- Success message start -->
    <section id="alert" class="hide">
      <img src="./assets/images/icon-success.svg" alt="" />
      <h1 class="success-heading">Thanks for subscribing!</h1>
      <p class="success-text"></p>
      <button class="dismiss-btn" type="button">Dismiss message</button>
      <!-- Success message end -->
    </section>

    <script src="index.js"></script>
  </body>
</html>
