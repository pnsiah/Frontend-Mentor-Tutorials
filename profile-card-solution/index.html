<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:ital@0;1&family=Kumbh+Sans:wght@100..900&display=swap"
      rel="stylesheet"
    />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <link rel="stylesheet" href="styles.css" />

    <title>Profile Card</title>
  </head>
  <body>
    <main class="profile-card">
      <header>
        <img src="./images/image-victor.jpg" alt="" class="profile__img" />
      </header>

      <div class="profile-data">
        <h1 class="details">Victor Crest <span>26</span></h1>
        <p class="place">London</p>
      </div>
      <div class="profile__socials">
        <div class="followers">
          <h1>80k</h1>
          <p>Followers</p>
        </div>
        <div class="likes">
          <h1>803k</h1>
          <p>Likes</p>
        </div>
        <div class="followers">
          <h1>1.4k</h1>
          <p>Photos</p>
        </div>
      </div>
    </main>
  </body>
</html>
